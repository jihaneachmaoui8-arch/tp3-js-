
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TP 3 JavaScript</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>TP 3 : JavaScript et DOM</h1>

    <!-- EXERCICE 1 -->
    <section>
        <h2>Exercice 1</h2>
        <button type="button" id="commencer">Commencer</button>
    </section>

    <!-- EXERCICE 2 -->
    <section id="outils">
        <h2>Outils de calcul</h2>

        <label>Donner un entier N :</label>
        <input type="text" id="nombreN">

        <button type="button" id="calculerSomme">
            Calculer la somme
        </button>

        <button type="button" id="afficherPairs">
            Afficher les nombres pairs
        </button>

        <p id="resultatCalcul"></p>
    </section>

    <!-- EXERCICE 3 -->
    <section id="cours">
        <h2 id="titreCours">Découvrir JavaScript</h2>

        <p class="chapitre">Les variables</p>
        <p class="chapitre important">Les fonctions</p>
        <p class="chapitre">Les événements</p>

        <button type="button" id="modifier">
            Modifier la présentation
        </button>
    </section>

    <!-- EXERCICE 4 -->
    <section>
        <h2>Zone interactive</h2>

        <label for="prenom">Prénom :</label>

        <input type="text" id="prenom"
            onfocus="mettreEnEvidence(this)"
            onblur="retablirStyle(this)"
            oninput="afficherSaisie(this)">

        <p id="apercu"></p>

        <button type="button" id="selectionner">
            Sélectionner le texte
        </button>

        <p id="survol"
            onmouseover="changerCouleur(this)"
            onmouseout="retablirCouleur(this)">
            Survolez ce texte.
        </p>
    </section>

    <!-- EXERCICE 5 -->
    <section>
        <h2>Formulaire d'inscription</h2>

        <form id="formInscription" name="inscription">

            <p>
                <label>Nom :</label>
                <input type="text" name="nom" id="nom">
            </p>

            <p>
                <label>Profession :</label>
                <select name="profession" id="profession">
                    <option value="">Choisir une profession</option>
                    <option value="Technicien">Technicien</option>
                    <option value="Ingénieur">Ingénieur</option>
                    <option value="Médecin">Médecin</option>
                </select>
            </p>

            <p>Sexe :</p>
            <input type="radio" name="sexe" value="H"> H
            <input type="radio" name="sexe" value="F"> F

            <p>Langues :</p>
            <input type="checkbox" name="langue" value="Arabe"> Arabe
            <input type="checkbox" name="langue" value="Français"> Français

            <p>
                <button type="submit">Inscrire</button>
                <button type="reset">Effacer</button>
            </p>

        </form>

        <p id="message"></p>
        <div id="recapitulatif"></div>

    </section>

</body>
</html>
